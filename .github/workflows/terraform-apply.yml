name: Terraform Apply

# Paso MANUAL. Lo lanzas tú desde la pestaña Actions cuando ya revisaste el plan del PR.
# El job espera aprobación en el Environment 'production' (configúralo con "Required reviewers").
# No hace nada útil hasta que tengas Azure (var AZURE_ENABLED=true + secrets ARM_*).

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Carpeta del stack a aplicar (p. ej. stacks/rg-vm-basico)"
        required: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production          # -> Settings/Environments/production con Required reviewers
    if: ${{ vars.AZURE_ENABLED == 'true' }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: apply
        run: |
          d='${{ inputs.stack }}'
          terraform -chdir="$d" init -input=false -no-color
          terraform -chdir="$d" apply -input=false -no-color -auto-approve

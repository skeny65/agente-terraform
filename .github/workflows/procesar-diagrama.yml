name: Procesar diagrama

# Deja el/los .drawio (y un .xlsx opcional) en la carpeta  diagrama/  del repo
# (repo -> Add file -> Upload files -> commit a main), y GitHub hace el resto:
#
#   descifra (determinista, SIN LLM) -> genera Terraform en stacks/<nombre>/
#   -> abre un Pull Request -> el PR dispara "Terraform Validate"
#      (fmt / init / validate / tflint -> comentario en el PR).
#
# Alternativa sin subir archivo: Actions -> "Procesar diagrama" -> Run workflow ->
# pega el XML del .drawio en el campo 'diagrama_xml'
# (en draw.io: Extras -> Edit Diagram -> copiar todo).
#
# El flujo llega SOLO hasta 'validate' (aún no hay Azure -> no hay 'plan' ni 'apply').

on:
  workflow_dispatch:
    inputs:
      diagrama_xml:
        description: "Contenido del .drawio (pega aquí el XML). Déjalo vacío si ya subiste el archivo a diagrama/."
        required: false
        type: string
      nombre:
        description: "Nombre del stack (opcional; por defecto se saca del diagrama)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "diagrama/**"
      - "!diagrama/README.md"
      - "inbox/**"
      - "!inbox/README.md"
      - "*.drawio"          # también si subes el .drawio a la raíz del repo

permissions:
  contents: write
  pull-requests: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # con AGENT_PAT el PR resultante SÍ dispara "Terraform Validate"; sin él, se usa
          # el token normal y el PR habrá que abrirlo/relanzarlo a mano.
          token: ${{ secrets.AGENT_PAT || github.token }}

      - name: Guardar el XML pegado en diagrama/ (si se usó el campo)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagrama_xml != '' }}
        shell: bash
        env:
          DIAGRAMA_XML: ${{ inputs.diagrama_xml }}
          NOMBRE: ${{ inputs.nombre }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p diagrama
          slug=$(printf '%s' "$NOMBRE" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9._-')
          [ -z "$slug" ] && slug="diagrama-${RUN_ID}"
          printf '%s' "$DIAGRAMA_XML" > "diagrama/${slug}.drawio"
          echo "Guardado diagrama/${slug}.drawio ($(wc -c < "diagrama/${slug}.drawio") bytes)"
          head -c 120 "diagrama/${slug}.drawio"; echo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet openpyxl

      - name: Descifrar + generar Terraform
        id: gen
        run: python scripts/ci_procesar.py

      - name: Rama + commit + Pull Request
        if: steps.gen.outputs.nuevos != '0' && steps.gen.outputs.nuevos != ''
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT || github.token }}
          TIENE_PAT: ${{ secrets.AGENT_PAT != '' }}
          STACKS: ${{ steps.gen.outputs.stacks }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          BR="diagrama/${RUN_ID}"
          git config user.name  "agente-terraform"
          git config user.email "agente@local"
          git checkout -b "$BR"
          git add -A
          git commit -m "infra: stacks generados desde el diagrama (run ${RUN_ID})"
          git push origin "$BR"
          BODY=$(printf 'Terraform generado automáticamente desde el diagrama.\n\nStacks: `%s`\n\nEl workflow **Terraform Validate** comprueba fmt / init / validate / tflint y comenta abajo. Es el último stage (sin `plan`, aún no hay Azure). Revisa y mergea.' "$STACKS")
          if [ "$TIENE_PAT" = "true" ]; then
            gh pr create --base main --head "$BR" --title "infra: $STACKS" --body "$BODY"
          else
            echo "::warning::No hay secret AGENT_PAT. Rama '$BR' subida; abre el PR a mano: https://github.com/${REPO}/pull/new/${BR}  (y así se ejecutará 'Terraform Validate')."
          fi

      - name: Aviso si no se generó nada
        if: steps.gen.outputs.nuevos == '0' || steps.gen.outputs.nuevos == ''
        run: |
          echo "::warning::No había ningún .drawio que procesar. Pega el XML en el campo 'diagrama_xml', o sube el .drawio a diagrama/ (o a inbox/ o a la raíz del repo)."

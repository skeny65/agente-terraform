name: Terraform Validate

# Red de seguridad para PRs donde alguien edita stacks/** A MANO.
# El flujo normal (subir .drawio a diagrama/) YA valida dentro de "Procesar diagrama",
# así que este workflow es secundario. En cada PR que toque stacks/**:
#   fmt / init -backend=false / validate / tflint  -> comenta el resultado.
# NO ejecuta 'terraform plan' (aún no hay Azure). El job 'plan' se añadirá aquí el
# día que existan la variable de repo AZURE_ENABLED y los secrets ARM_*.

on:
  pull_request:
    paths:
      - "stacks/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: fmt · init · validate · tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar stacks afectados
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
            changed=$(git diff --name-only "$base" "$head" | grep -E '^stacks/[^/]+/' | sed -E 's#^(stacks/[^/]+)/.*#\1#' | sort -u || true)
          else
            changed=$(find stacks -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort || true)
          fi
          [ -z "$changed" ] && changed=$(find stacks -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort || true)
          echo "stacks<<EOF"  >> "$GITHUB_OUTPUT"
          echo "$changed"     >> "$GITHUB_OUTPUT"
          echo "EOF"          >> "$GITHUB_OUTPUT"
          echo "Stacks: $changed"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: fmt / init -backend=false / validate / tflint
        id: checks
        shell: bash
        run: |
          set -o pipefail
          RES=""
          FAIL=0
          for d in ${{ steps.detect.outputs.stacks }}; do
            [ -d "$d" ] || continue
            echo "::group::$d"
            OUT=""
            terraform -chdir="$d" fmt -check -recursive -no-color 2>&1 | tee /tmp/fmt.txt || { FAIL=1; OUT="$OUT\n  fmt: FALLA (ejecuta 'terraform fmt')"; }
            terraform -chdir="$d" init -backend=false -input=false -no-color 2>&1 | tee /tmp/init.txt || { FAIL=1; OUT="$OUT\n  init: FALLA"; }
            terraform -chdir="$d" validate -no-color 2>&1 | tee /tmp/val.txt || { FAIL=1; OUT="$OUT\n  validate: FALLA\n$(sed 's/^/    /' /tmp/val.txt)"; }
            ( cd "$d" && tflint --no-color --format compact 2>&1 | tee /tmp/lint.txt ) || OUT="$OUT\n  tflint: avisos\n$(sed 's/^/    /' /tmp/lint.txt)"
            [ -z "$OUT" ] && OUT="\n  OK"
            RES="$RES\n### \`$d\`$OUT"
            echo "::endgroup::"
          done
          { echo "resumen<<EOF"; echo -e "$RES"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          exit $FAIL

      - name: Comentar resultado en el PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RESUMEN: ${{ steps.checks.outputs.resumen }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const resumen = (process.env.RESUMEN || '(sin detalle)').trim();
            const ok = process.env.JOB_STATUS === 'success';
            const body = "## Terraform — validación\n\n" + resumen + "\n\n"
              + (ok
                  ? "✅ fmt / init / validate / tflint OK. Es el último stage del flujo del agente (sin `plan`, aún no hay Azure). Revisa y mergea."
                  : "❌ Revisa los fallos de arriba.");
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('## Terraform — validación'));
            if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
